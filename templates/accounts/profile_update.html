{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Mettre à jour le profil{% endblock %}
{% block content %}
<div class="container mt-5">
    <h2>Mettre à jour votre profil</h2>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Mettre à jour</button>
    </form>
</div>
{% endblock %}
