{% extends 'base.html' %}
   {% load crispy_forms_tags %}
   {% block title %}Connexion{% endblock %}
   {% block content %}
   <div class="container mt-5">
       <h2>Connexion</h2>
       <form method="post">
           {% csrf_token %}
           {{ form|crispy }}
           <button type="submit" class="btn btn-primary">Se connecter</button>
       </form>
   </div>
   {% endblock %}
